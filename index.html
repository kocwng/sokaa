const form=document.getElementById('gate'), field=document.getElementById('key'), button=document.getElementById('submit'), error=document.getElementById('error'), remember=document.getElementById('remember');
const REMEMBER_KEY='kickoff-remembered-access', BUILD_ID=PAYLOAD.salt;
function openSite(html){document.open();document.write(html);document.close()}
try{const saved=JSON.parse(localStorage.getItem(REMEMBER_KEY)||'null');if(saved&&saved.build===BUILD_ID&&typeof saved.html==='string'){openSite(saved.html)}else if(saved){localStorage.removeItem(REMEMBER_KEY)}}catch(_){try{localStorage.removeItem(REMEMBER_KEY)}catch(__){}}
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;error.textContent='Memeriksa key…';try{const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value),'PBKDF2',false,['deriveKey']);const aes=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(PAYLOAD.salt),iterations:PAYLOAD.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(PAYLOAD.iv)},aes,decode(PAYLOAD.data));const html=new TextDecoder().decode(clear);try{if(remember.checked)localStorage.setItem(REMEMBER_KEY,JSON.stringify({build:BUILD_ID,html}));else localStorage.removeItem(REMEMBER_KEY)}catch(_){}field.value='';openSite(html)}catch(_){field.value='';error.textContent='Key salah. Coba lagi.';button.disabled=false;field.focus()}});
